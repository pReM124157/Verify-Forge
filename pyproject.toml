[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verifyforge"
version = "0.1.0"
description = "VerifyForge — Autonomous Specification-Driven Software Engineering Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["anthropic>=0.40", "pytest>=8", "rich>=13"]

[project.scripts]
verifyforge = "verifyforge.cli:main"

[tool.setuptools.package-data]
"verifyforge.demos" = ["rate_limiter/*"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
